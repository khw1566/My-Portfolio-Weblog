name = "my-portfolio-weblog"
main = "src/index.js"
compatibility_date = "2026-10-01"

# audreaming.com 을 이 Worker에 연결합니다.
# (도메인이 Cloudflare 계정에 등록되어 있어야 합니다. 하위 도메인을 쓰려면 pattern 을 바꾸세요.)
routes = [
  { pattern = "audreaming.com", custom_domain = true }
]

# CSS / HTML 파일을 문자열로 불러오기
# public/ 폴더의 파일(다이어그램 SVG 등)을 그대로 제공합니다. 예: public/diagrams/a.svg → /diagrams/a.svg
[assets]
directory = "public"

[[rules]]
type = "Text"
globs = ["**/*.css", "**/*.html"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "portfolio-db"
# audreaming.com 에 배포된 D1 데이터베이스 id (새 계정에 배포하려면 `npx wrangler d1 create portfolio-db` 결과로 바꾸세요)
database_id = "c80b0c07-c7ec-44be-b1c5-fc1b180bdb8a"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "portfolio-images"

[vars]
SITE_TITLE = "MECH.PORTFOLIO"
