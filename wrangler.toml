name = "my-portfolio-weblog"
main = "src/index.js"
compatibility_date = "2026-10-01"

# audreaming.com 을 이 Worker에 연결합니다.
# (도메인이 Cloudflare 계정에 등록되어 있어야 합니다. 하위 도메인을 쓰려면 pattern 을 바꾸세요.)
routes = [
  { pattern = "audreaming.com", custom_domain = true }
]

# CSS / HTML 파일을 문자열로 불러오기
[[rules]]
type = "Text"
globs = ["**/*.css", "**/*.html"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "portfolio-db"
# `npx wrangler d1 create portfolio-db` 실행 후 출력되는 id 로 바꾸세요.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "portfolio-images"

[vars]
SITE_TITLE = "MECH.PORTFOLIO"
